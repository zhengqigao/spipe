name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .

      - name: Acceptance suite
        # tb05 compares against HSPICE and Xyce, which need commercial licences
        # and are not available on a hosted runner. Everything else runs here.
        env:
          MPLBACKEND: Agg
        run: |
          fail=0
          for t in test/tb/tb*.py; do
            case "$t" in *tb05_*) echo "SKIP $t (needs HSPICE/Xyce)"; continue;; esac
            echo "::group::$t"
            python "$t" || fail=1
            echo "::endgroup::"
          done
          exit $fail
