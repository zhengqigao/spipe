# Optional conda environment for SPIPE.
#
#   conda env create -f environment.yaml
#   conda activate spipe
#   pip install -e .
#
# You do not need conda: `pip install -e .` into any Python >= 3.9 is enough, and
# pyproject.toml is the authority on what SPIPE actually requires. This file exists
# only to pin a known-good set for people who prefer conda.
#
# The `examples` extra (matplotlib, h5py) is included because the example scripts
# plot and read HDF5; drop those two lines for a library-only environment.
name: spipe
channels:
  - conda-forge
dependencies:
  - python>=3.9
  - numpy>=1.21
  - scipy>=1.6
  - pytorch>=1.13        # conda-forge calls it `pytorch`; on PyPI it is `torch`
  - matplotlib>=3.4      # examples only
  - h5py>=3.0            # examples only
  - pip
  - pip:
      - -e .
